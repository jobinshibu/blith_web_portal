<!doctype html>
<html lang="en">

<head>

  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" />

  <!-- Meta Pixel Code (Non-blocking queueing with deferred script injection) -->
  <script>

  <script>

    if ('serviceWorker' in navigator) {

</head>

<body>
  <!-- Meta Pixel noscript fallback -->
  <noscript><img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=2265492044286196&ev=PageView&noscript=1" /></noscript>

  <!-- Root Container with Instant Zero-Latency Skeleton Placeholder -->
  <div id="root">
    <div id="initial-skeleton" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #fff; min-height: 100vh; color: #111;">
      <style>
        @keyframes bShimmer {
          0% { background-position: -200% 0; }
          100% { background-position: 200% 0; }
        }
        .b-shim {
          background: linear-gradient(90deg, #f0f0f4 0%, #e4e4ec 50%, #f0f0f4 100%);
          background-size: 200% 100%;
          animation: bShimmer 1.5s infinite ease-in-out;
          border-radius: 8px;
        }
        .b-header {
          display: flex; justify-content: space-between; align-items: center;
          padding: 14px 24px; border-bottom: 1px solid #f0f0f0; max-width: 1280px; margin: 0 auto;
        }
        .b-body {
          max-width: 1280px; margin: 0 auto; padding: 24px;
        }
        .b-hero {
          width: 100%; height: 320px; border-radius: 20px; margin-bottom: 32px;
        }
        .b-cats {
          display: flex; gap: 12px; overflow: hidden; margin-bottom: 32px;
        }
        .b-cat {
          width: 110px; height: 42px; border-radius: 999px; flex-shrink: 0;
        }
        .b-grid {
          display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px;
        }
        .b-card {
          border-radius: 16px; overflow: hidden; background: #fafafa; border: 1px solid #f0f0f4;
        }
        .b-card-img {
          height: 180px; width: 100%;
        }
        .b-card-body {
          padding: 16px; display: flex; flex-direction: column; gap: 10px;
        }
        @media (max-width: 768px) {
          .b-hero { height: 220px; }
          .b-header, .b-body { padding: 12px 16px; }
        }
      </style>
      <div class="b-header">
        <div class="b-shim" style="width: 105px; height: 32px; border-radius: 8px;"></div>
        <div style="display: flex; gap: 16px;">
          <div class="b-shim" style="width: 70px; height: 32px; border-radius: 20px;"></div>
          <div class="b-shim" style="width: 80px; height: 32px; border-radius: 20px;"></div>
        </div>
      </div>
      <div class="b-body">
        <div class="b-shim b-hero"></div>
        <div class="b-cats">
          <div class="b-shim b-cat"></div>
          <div class="b-shim b-cat"></div>
          <div class="b-shim b-cat"></div>
          <div class="b-shim b-cat"></div>
          <div class="b-shim b-cat"></div>
        </div>
        <div class="b-grid">
          <div class="b-card">
            <div class="b-shim b-card-img"></div>
            <div class="b-card-body">
              <div class="b-shim" style="height: 18px; width: 75%;"></div>
              <div class="b-shim" style="height: 14px; width: 45%;"></div>
              <div class="b-shim" style="height: 28px; width: 90px; border-radius: 6px; margin-top: 6px;"></div>
            </div>
          </div>
          <div class="b-card">
            <div class="b-shim b-card-img"></div>
            <div class="b-card-body">
              <div class="b-shim" style="height: 18px; width: 80%;"></div>
              <div class="b-shim" style="height: 14px; width: 50%;"></div>
              <div class="b-shim" style="height: 28px; width: 90px; border-radius: 6px; margin-top: 6px;"></div>
            </div>
          </div>
          <div class="b-card">
            <div class="b-shim b-card-img"></div>
            <div class="b-card-body">
              <div class="b-shim" style="height: 18px; width: 70%;"></div>
              <div class="b-shim" style="height: 14px; width: 40%;"></div>
              <div class="b-shim" style="height: 28px; width: 90px; border-radius: 6px; margin-top: 6px;"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

</html>
